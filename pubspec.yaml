publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  drift: 2.34.4
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
